[package]
name = "undertone"
version = "0.2.0"
description = "Local-first voice dictation for Windows"
authors = ["Undertone"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "undertone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
hound = "3.5"
arboard = "3.7"
enigo = "0.6"
reqwest = { version = "0.13", features = ["json", "query"] }
chrono = "0.4"
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
