name: Release

# 推送 vX.Y.Z 標籤時建置 installer 並建立 GitHub Release；
# 也可以從 Actions 頁面手動執行，只會產出 artifact 供下載。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 建置 Windows 安裝檔
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安裝前端依賴
        run: npm ci

      - name: 建立 Python 虛擬環境（不預先下載模型）
        run: powershell -ExecutionPolicy Bypass -File scripts/setup.ps1 -SkipModel

      - name: 打包轉錄引擎（PyInstaller onefile）
        run: powershell -ExecutionPolicy Bypass -File scripts/build-sidecar.ps1

      - name: 建置 Tauri 安裝檔
        run: npm run tauri build

      - name: 上傳安裝檔
        uses: actions/upload-artifact@v4
        with:
          name: murmur-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 發佈 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
